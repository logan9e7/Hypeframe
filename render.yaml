services:
  - type: web
    name: hypeframe-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m app.seed
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CORS_ORIGINS
        value: http://localhost:3000
# WARNING: Default SQLite is ephemeral on Render. Set DATABASE_URL to a persistent PostgreSQL
# instance before relying on user-generated data. Update CORS_ORIGINS to the actual frontend URL.
