name: Frontend checks
on:
  push:
    paths: ['src/**', 'package.json', 'tsconfig.json', 'next.config.ts', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['src/**', 'package.json', 'tsconfig.json', 'next.config.ts', '.github/workflows/frontend.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
